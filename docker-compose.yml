# Optional PostgreSQL (the slides list PostgreSQL).  Not exercised in the build sandbox - SQLite is the tested default.
#   docker compose up -d
#   export DATABASE_URL=postgresql+psycopg2://pms:pms@localhost:5432/pms     (Windows PowerShell: $env:DATABASE_URL="...")
#   pip install psycopg2-binary && python scripts/02_generate_pms.py
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: pms, POSTGRES_PASSWORD: pms, POSTGRES_DB: pms}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes: {pgdata: {}}
